<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 배경 그라데이션 -->
    <radialGradient id="bgGrad" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <!-- 네온 발광 필터 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <style>
    .font-pixel { font-family: 'DungGeunMo', monospace, sans-serif; font-weight: bold; }
    .font-sans { font-family: 'Pretendard', -apple-system, sans-serif; }
  </style>

  <!-- 배경 렉트 -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- 복셀 원근감 그리드 라인 -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.12">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- 상단 뱃지 그룹 -->
  <g transform="translate(70, 65)">
    <!-- 붉은 호외 뱃지 -->
    <rect x="0" y="0" width="130" height="38" rx="8" fill="#dc2626" stroke="#f87171" stroke-width="2" />
    <text x="65" y="24" text-anchor="middle" fill="#ffffff" font-size="16" class="font-pixel">📰 호외 (號外)</text>

    <!-- 게임 장르 뱃지 -->
    <rect x="145" y="0" width="220" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="255" y="24" text-anchor="middle" fill="#38bdf8" font-size="15" class="font-pixel">3D 복셀 시뮬레이션 게임</text>

    <!-- 추석 인사 농사 뱃지 -->
    <rect x="380" y="0" width="220" height="38" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="490" y="24" text-anchor="middle" fill="#f59e0b" font-size="15" class="font-pixel">🌾 추석 이후 인사 농사 시스템</text>
  </g>

  <!-- 메인 영문 타이틀 -->
  <text x="70" y="175" fill="#f59e0b" font-size="28" letter-spacing="4" class="font-pixel" filter="url(#glow)">
    PERSONNEL CRAFT
  </text>

  <!-- 메인 한글 대형 타이틀 -->
  <text x="70" y="275" fill="#ffffff" font-size="78" class="font-pixel">
    인사 <tspan fill="#38bdf8">크래프트</tspan>
  </text>

  <!-- 부제 바 -->
  <g transform="translate(70, 315)">
    <rect x="0" y="0" width="560" height="52" rx="10" fill="#0b1329" stroke="#334155" stroke-width="2" />
    <rect x="0" y="0" width="8" height="52" rx="4" fill="#f59e0b" />
    <text x="25" y="32" fill="#cbd5e1" font-size="20" class="font-pixel">
      편집국 생존기 — 이번엔 제발 원하는 부서로!
    </text>
  </g>

  <!-- 특징 칩 3종 -->
  <g transform="translate(70, 400)">
    <rect x="0" y="0" width="170" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="85" y="26" text-anchor="middle" fill="#93c5fd" font-size="14" class="font-pixel">📊 기자 경력 다각형 분석</text>

    <rect x="185" y="0" width="170" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="270" y="26" text-anchor="middle" fill="#93c5fd" font-size="14" class="font-pixel">👔 부서장 가상 면담</text>

    <rect x="370" y="0" width="190" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="465" y="26" text-anchor="middle" fill="#93c5fd" font-size="14" class="font-pixel">🎲 1만회 몬테카를로 확률</text>
  </g>

  <!-- 우측 3D 복셀 카드 쇼케이스 -->
  <g transform="translate(730, 85)">
    <!-- 카드 배경 섀도우 -->
    <rect x="10" y="10" width="400" height="460" rx="20" fill="#000000" opacity="0.7" />
    <rect x="0" y="0" width="400" height="460" rx="20" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="3" />

    <!-- 3D 큐브/캐릭터 아바타 프레임 -->
    <g transform="translate(130, 45)">
      <rect x="0" y="0" width="140" height="140" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-width="3" filter="url(#glow)" />
      <text x="70" y="95" text-anchor="middle" font-size="70">👨‍💼</text>
      <rect x="25" y="115" width="90" height="26" rx="6" fill="#f59e0b" />
      <text x="70" y="132" text-anchor="middle" fill="#000" font-size="12" font-weight="900" class="font-pixel">PRESS 기 자</text>
    </g>

    <!-- 카드 텍스트 -->
    <text x="200" y="235" text-anchor="middle" fill="#fde047" font-size="22" class="font-pixel">
      “이번 인사는 어디로 갈까?”
    </text>
    <text x="200" y="270" text-anchor="middle" fill="#94a3b8" font-size="14" class="font-sans">
      경력은 내가 쌓지만, 발령은 내 맘대로 안 된다!
    </text>
    <text x="200" y="295" text-anchor="middle" fill="#38bdf8" font-size="13" class="font-pixel">
      하반기 정기인사 발령 시뮬레이터
    </text>

    <!-- 보석(Gem) 5개 -->
    <g transform="translate(110, 335)">
      <g transform="translate(0, 0) rotate(45)"><rect width="20" height="20" rx="3" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" /></g>
      <g transform="translate(45, 0) rotate(45)"><rect width="20" height="20" rx="3" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" /></g>
      <g transform="translate(90, 0) rotate(45)"><rect width="20" height="20" rx="3" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" /></g>
      <g transform="translate(135, 0) rotate(45)"><rect width="20" height="20" rx="3" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" /></g>
      <g transform="translate(180, 0) rotate(45)"><rect width="20" height="20" rx="3" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" /></g>
    </g>

    <!-- 하단 상태 태그 -->
    <rect x="40" y="390" width="320" height="40" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1.5" />
    <circle cx="65" cy="410" r="5" fill="#22c55e" />
    <text x="80" y="415" fill="#e2e8f0" font-size="13" class="font-pixel">
      정기인사위원회 결재 대기 중...
    </text>
  </g>

  <!-- 하단 푸터 바 -->
  <line x1="70" y1="570" x2="1130" y2="570" stroke="#334155" stroke-width="1.5" opacity="0.7" />
  <text x="70" y="598" fill="#64748b" font-size="14" class="font-pixel">
    한국 언론사 정기인사 데이터저널리즘 가상 시뮬레이션
  </text>
  <text x="1130" y="598" text-anchor="end" fill="#94a3b8" font-size="14" class="font-pixel">
    배포: <tspan fill="#38bdf8" font-weight="bold">databrew</tspan> (https://raspos.github.io/personnel-craft/)
  </text>
</svg>
